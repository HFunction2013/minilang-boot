name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout boot
        uses: actions/checkout@v4

      - name: Checkout compiler (test programs + syslib)
        uses: actions/checkout@v4
        with:
          repository: HFunction2013/minilang-compiler
          ref: ${{ github.head_ref || github.ref_name }}
          path: minilang-compiler
          submodules: true

      - name: Install C toolchain + make (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: make

      - name: Build (Windows, MSVC)
        if: runner.os == 'Windows'
        shell: bash
        run: cmake -B build && cmake --build build --config Release

      - name: Add boot binary to PATH (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "${{ github.workspace }}/minilang-boot" >> $GITHUB_PATH

      - name: Run every tests/*.mil through the boot VM (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          MINILANG_DIR: ${{ github.workspace }}/minilang-compiler
        run: |
          set -e
          for f in minilang-compiler/tests/*.mil; do
            echo "--- $f ---"
            ./minilang run "$f"
          done

      - name: VM smoke over tests/*.mil (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          MINILANG_DIR: ${{ github.workspace }}/minilang-compiler
        run: |
          set -e
          BIN=build/Release/minilang.exe
          for f in minilang-compiler/tests/*.mil; do
            echo "--- $f ---"
            "$BIN" run "$f"
          done

  # Installer smoke: build on site via scripts/install.sh, lay down the prefix,
  # add PATH, and run the installed command from a clean shell.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout boot
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install C toolchain + make (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make

      - name: Run installer
        env:
          MINILANG_PREFIX: ${{ github.workspace }}/ml-prefix
        run: bash scripts/install.sh

      - name: Verify installed command
        env:
          PREFIX: ${{ github.workspace }}/ml-prefix
        run: |
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          export PATH="$PREFIX/bin:$PATH"
          cat > smoke.mil <<'EOF'
          func main() {
              println "installed OK";
              return 0;
          }
          EOF
          minilang run smoke.mil

  # Pure-fetch smoke: no local sibling tree on the runner. The installer script
  # is staged in a temp dir outside any checkout, so it fetches boot + syslib
  # itself (git clone fallback) and lays down a working prefix.
  install-fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout boot (script only)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install C toolchain + make
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make

      - name: Stage standalone installer
        run: |
          mkdir -p "$RUNNER_TEMP/standalone/scripts"
          cp scripts/install.sh "$RUNNER_TEMP/standalone/scripts/"

      - name: Run installer (pure fetch)
        env:
          MINILANG_PREFIX: ${{ github.workspace }}/ml-fetch-prefix
        run: bash "$RUNNER_TEMP/standalone/scripts/install.sh"

      - name: Verify installed command
        env:
          PREFIX: ${{ github.workspace }}/ml-fetch-prefix
        run: |
          export PATH="$PREFIX/bin:$PATH"
          cat > smoke.mil <<'EOF'
          func main() {
              println "fetched OK";
              return 0;
          }
          EOF
          minilang run smoke.mil

  # Archive fallback smoke: force the no-git path (MINILANG_NO_GIT=1), which
  # downloads codeload tarballs and extracts them instead of cloning.
  install-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout boot (script only)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install C toolchain + make
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make

      - name: Stage standalone installer
        run: |
          mkdir -p "$RUNNER_TEMP/standalone/scripts"
          cp scripts/install.sh "$RUNNER_TEMP/standalone/scripts/"

      - name: Run installer (archive fallback)
        env:
          MINILANG_PREFIX: ${{ github.workspace }}/ml-archive-prefix
          MINILANG_NO_GIT: '1'
        run: bash "$RUNNER_TEMP/standalone/scripts/install.sh"

      - name: Verify installed command
        env:
          PREFIX: ${{ github.workspace }}/ml-archive-prefix
        run: |
          export PATH="$PREFIX/bin:$PATH"
          cat > smoke.mil <<'EOF'
          func main() {
              println "archive OK";
              return 0;
          }
          EOF
          minilang run smoke.mil
